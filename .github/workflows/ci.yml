name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 22 * * 0" # weekly, Monday 03:57 IST: re-check against the latest test suites
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Sandbox tests (modes, seed, reset)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/payments-api/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r services/payments-api/requirements.txt pytest
      - run: pytest -q

  docker:
    name: Docker image starts and serves both apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: arya-bank-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Practice mode (default)
        run: |
          docker run -d --name practice -p 8000:8000 -p 4173:4173 arya-bank-sandbox:ci
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' practice)" = healthy ] && break; sleep 2; done
          docker inspect -f '{{.State.Health.Status}}' practice | grep -q healthy
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"mode":"practice"'
          curl -sf localhost:4173/api/health | grep -q '"mode":"practice"'
          curl -sf localhost:8000/accounts/AB000002 | grep -q holder_name
          curl -sf localhost:8000/docs | grep -qi swagger
          curl -sf localhost:4173/login | grep -q 'data-bugs="UI-01'
          curl -sf -X POST localhost:8000/_admin/reset | grep -q RESET
          docker logs practice
          docker rm -f practice
      - name: Clean mode
        run: |
          docker run -d --name clean -p 8000:8000 -p 4173:4173 -e ARYA_MODE=clean arya-bank-sandbox:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health >/dev/null && curl -sf localhost:4173/api/health >/dev/null && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"mode":"clean"'
          curl -sf localhost:4173/api/health | grep -q '"plantedBugs":\[\]'
          docker rm -f clean

  payments-suite:
    # The Java suite in byshivam/payments-api-testing must still pass on the clean
    # build and catch every planted API bug when it runs against this sandbox's code.
    name: Compatibility - payments-api-testing (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: sandbox
      - uses: actions/checkout@v5
        with:
          repository: byshivam/payments-api-testing
          path: suite
      - name: Point the suite at the sandbox's payments API
        run: |
          rm -rf suite/app/arya_payments
          cp -r sandbox/services/payments-api/arya_payments suite/app/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r sandbox/services/payments-api/requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: suite/pom.xml
      - name: Bug hunt (clean build + each planted bug + all bugs)
        working-directory: suite
        run: python scripts/bug_hunt.py
      - name: Results
        if: always()
        run: cat suite/reports/BUG_HUNT.md >> "$GITHUB_STEP_SUMMARY" || true

  ui-suite:
    name: Compatibility - netbanking-ui-testing (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    env:
      CI: "true"
      PW_BUG_PROJECTS: chromium,firefox,mobile-chrome
    steps:
      - uses: actions/checkout@v5
        with:
          path: sandbox
      - uses: actions/checkout@v5
        with:
          repository: byshivam/netbanking-ui-testing
          path: suite
      - name: Point the suite at the sandbox's net banking app
        run: |
          rm -rf suite/app/server.mjs suite/app/bugs.mjs suite/app/public
          cp -r sandbox/services/netbanking-web/. suite/app/
      - name: Install
        working-directory: suite
        run: npm ci
      - name: Visual baselines (only if the suite has none committed yet)
        working-directory: suite
        if: hashFiles('suite/tests/visual/visual.spec.ts-snapshots/*.png') == ''
        run: npx playwright test --grep @visual --update-snapshots=all
      - name: Bug hunt (clean app + each planted bug)
        working-directory: suite
        run: node scripts/bug-hunt.mjs
      - name: Results
        if: always()
        run: cat suite/reports/BUG_HUNT.md >> "$GITHUB_STEP_SUMMARY" || true
